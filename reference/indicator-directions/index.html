<!doctype html>
<!--
  Password page for `npm run build:pages` (a StatiCrypt template). It matches the
  calendar's "Prototype Portal" login. The password is always remembered, so it's
  asked once per browser (until it expires). /prototype_one_docs is filled in by the build script.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prototype Portal</title>
<link rel="icon" href="/prototype_one_docs/favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url("/prototype_one_docs/fonts/inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; font-display: swap; src: url("/prototype_one_docs/fonts/inter-latin-600-normal.woff2") format("woff2"); }
  :root {
    --bg: #1e1e1e; --panel: #262626; --control: #323232; --fg: #ffffff; --muted: #a6a6a6;
    --line: #303030; --line-strong: #3c3c3c; --accent: #28557d; --accent-fg: #ffffff; --accent-text: #8fbce6;
    --danger: #ff7b6b; --shadow: 0 12px 32px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  .login { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .login-card { width: min(380px, 100%); padding: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 4px; }
  .login-sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field-label { font-size: 12.5px; font-weight: 600; }
  .field input { height: 38px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--control); font-size: 14px; }
  .field input:focus-visible { outline: 2px solid var(--accent-text); outline-offset: -1px; }
  .field input[aria-invalid="true"] { border-color: var(--danger); }
  .check { display: flex; align-items: center; gap: 9px; font-size: 13px; cursor: pointer; margin-bottom: 16px; }
  .form-err { margin: 0 0 10px; color: var(--danger); font-size: 12.5px; }
  .form-err:empty { display: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 38px; padding: 0 14px; border: 1px solid var(--accent);
    border-radius: 6px; background: var(--accent); color: var(--accent-fg); font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 1px; }
</style>
</head>
<body>
<main id="staticrypt_content" class="login hidden">
  <form id="staticrypt-form" class="login-card" action="#" method="post" novalidate>
    <h1>Prototype Portal</h1>
    <p class="login-sub">Enter the password you were given.</p>
    <!-- Hidden username lets password managers save the password -->
    <input type="text" name="username" value="docs" autocomplete="username" hidden>
    <label class="field">
      <span class="field-label">Password</span>
      <input type="password" id="staticrypt-password" name="password" autocomplete="current-password" required aria-describedby="loginError">
    </label>
    <label class="check"><input type="checkbox" id="showPassword"> Show password</label>
    <p class="form-err" id="loginError" role="alert"></p>
    <button type="submit" class="btn">Log in</button>
  </form>
</main>
